[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "eshop-manager"
version = "0.1.0"
description = "E-shop management console system"
requires-python = ">=3.11"

[project.scripts]
eshop-manager = "eshop_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]